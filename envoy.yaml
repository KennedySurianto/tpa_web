static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080  # Envoy listens here for gRPC-Web requests
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: grpc_services
                      domains: ["*"]
                      # CORS configuration moved to virtual host level
                      cors:
                        allow_origin_string_match:
                          - prefix: "*"
                        allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
                        allow_headers: "keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,grpc-status,grpc-message"
                        max_age: "1728000"
                        expose_headers: "grpc-status,grpc-message,grpc-status-details-bin"
                        allow_credentials: false
                      routes:
                        # Route user-service gRPC calls
                        - match:
                            prefix: "/user.UserService/"
                          route:
                            cluster: user-service

                        # Route auth-service gRPC calls
                        - match:
                            prefix: "/auth.AuthService/"
                          route:
                            cluster: auth-service

                        # Route video-service gRPC calls
                        - match:
                            prefix: "/video.VideoService/"
                          route:
                            cluster: video-service

                        # Route activity-service gRPC calls
                        - match:
                            prefix: "/activity.CommentService/"
                          route:
                            cluster: activity-service

                        - match:
                            prefix: "/activity.LikeService/"
                          route:
                            cluster: activity-service

                        - match:
                            prefix: "/activity.WatchService/"
                          route:
                            cluster: activity-service

                        - match:
                            prefix: "/activity.LikeCommentService/"
                          route:
                            cluster: activity-service

                        - match:
                            prefix: "/activity.FollowService/"
                          route:
                            cluster: activity-service

                        # Route chat-service gRPC calls
                        - match:
                            prefix: "/chat.ChatService/"
                          route:
                            cluster: chat-service

                        - match:
                            prefix: "/ws"
                          route:
                            cluster: chat-service-ws
                            prefix_rewrite: "/ws"
                            upgrade_configs:
                              - upgrade_type: websocket
                                enabled: true

                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router


  clusters:
    # User Service cluster
    - name: user-service
      connect_timeout: 0.25s
      type: logical_dns
      http2_protocol_options: {}  # Enable HTTP/2 for gRPC
      lb_policy: round_robin
      load_assignment:
        cluster_name: user-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: user-service
                      port_value: 50051

    # Auth Service cluster
    - name: auth-service
      connect_timeout: 0.25s
      type: logical_dns
      http2_protocol_options: {}  # Enable HTTP/2 for gRPC
      lb_policy: round_robin
      load_assignment:
        cluster_name: auth-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auth-service
                      port_value: 50052

    # Video Service cluster
    - name: video-service
      connect_timeout: 0.25s
      type: logical_dns
      http2_protocol_options: {}  # Enable HTTP/2 for gRPC
      lb_policy: round_robin
      load_assignment:
        cluster_name: video-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: video-service
                      port_value: 50053
    
    # Activity Service cluster
    - name: activity-service
      connect_timeout: 0.25s
      type: logical_dns
      http2_protocol_options: {}  # Enable HTTP/2 for gRPC
      lb_policy: round_robin
      load_assignment:
        cluster_name: activity-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: activity-service
                      port_value: 50054

    # Chat Service cluster
    - name: chat-service
      connect_timeout: 0.25s
      type: logical_dns
      http2_protocol_options: {}  # Enable HTTP/2 for gRPC
      lb_policy: round_robin
      load_assignment:
        cluster_name: chat-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: chat-service
                      port_value: 50055
                    
    - name: chat-service-ws
      connect_timeout: 0.25s
      type: logical_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: chat-service-ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: chat-service
                      port_value: 8081

admin:
  access_log_path: "/tmp/admin_access.log"
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901