services:
  # nanti setiap db nya kan pasti bakal banyak, bikin aja kek user-db, tambahin depends on & environment (DB URL) kek user-service.
  # make sure di db service backend codenya pake DATABASE_URL environment variable untuk koneksi ke database
  # jgn lupa bikin volume untuk persist data
  user-db:
    container_name: user-db
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  video-db:
    container_name: video-db
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_service_db
    ports:
      - "5434:5432"
    volumes:
      - video-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_service_db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  activity-db:
    container_name: activity-db
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: activity_service_db
    ports:
      - "5435:5432"
    volumes:
      - activity-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activity_service_db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  chat-db:
    container_name: chat-db
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_service_db
    ports:
      - "5436:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_service_db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  envoy:
    container_name: envoy
    image: envoyproxy/envoy:v1.29-latest
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - 8080:8080
      - 9901:9901
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9901/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # optional explicit command:
    # command: ["-c", "/etc/envoy/envoy.yaml"]

  memcached:
    container_name: memcached 
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  user-service:
    container_name: user-service
    build: 
      context: ./backend
      dockerfile: user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@user-db:5432/user_service_db
    ports:
      - 50051:50051
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth-service:
    container_name: auth-service
    build: 
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports:
      - 50052:50052
    depends_on:
      user-service:
        condition: service_healthy
      memcached:
        condition: service_healthy
    environment:
      MEMCACHED_HOST: memcached:11211
      SMTP_USER: tpawebkn@gmail.com
      SMTP_PASS: dwjb nfyf usuq qhuz
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 50051
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50052"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  video-service:
    container_name: video-service
    build: 
      context: ./backend
      dockerfile: video-service/Dockerfile
    ports:
      - 50053:50053
    depends_on:
      video-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@video-db:5432/video_service_db
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: videos
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 50051
      ACTIVITY_SERVICE_HOST: activity-service
      ACTIVITY_SERVICE_PORT: 50054
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50053"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  activity-service:
    container_name: activity-service
    build: 
      context: ./backend
      dockerfile: activity-service/Dockerfile
    ports:
      - 50054:50054
    depends_on:
      activity-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@activity-db:5432/activity_service_db
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 50051
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50054"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chat-service:
    container_name: chat-service
    build: 
      context: ./backend
      dockerfile: chat-service/Dockerfile
    expose:
      - "50055"   # gRPC
      - "8081"    # WebSocket/HTTP
    ports:
      - 50055:50055
      - 8081:8081
    depends_on:
      chat-db: 
        condition: service_healthy
    #   user-service:
    #     condition: service_healthy
    environment:
      PORT: 50055
      DATABASE_URL: postgres://postgres:postgres@chat-db:5432/chat_service_db
      # USER_SERVICE_HOST: user-service
      # USER_SERVICE_PORT: 50051
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50055"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  live-service:
    container_name: live-service
    build: 
      context: ./backend
      dockerfile: live-service/Dockerfile
    expose:
      - "50056"
    ports:
      - 50056:50056
    environment:
      PORT: 50056
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50056"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    
  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - 3000:3000
    networks:
      - app-network
    volumes:
    - ./frontend:/app           # Mount local code into container
    - /app/node_modules         # Prevent overwriting node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  user-db-data:
  video-db-data:
  activity-db-data:
  chat-db-data:
  minio-data:

networks:
  app-network:
    driver: bridge