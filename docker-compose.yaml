services:
  user-db:
    container_name: user-db
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  video-db:
    container_name: video-db
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${VIDEO_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - video-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${VIDEO_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  activity-db:
    container_name: activity-db
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ACTIVITY_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - activity-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ACTIVITY_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  chat-db:
    container_name: chat-db
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CHAT_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CHAT_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  playlist-db:
    container_name: playlist-db
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLAYLIST_DB_NAME}
    ports:
      - "5437:5432"
    volumes:
      - playlist-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PLAYLIST_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Application services
  envoy:
    container_name: envoy
    image: envoyproxy/envoy:v1.29-latest
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - 8080:8080
      - 9901:9901
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9901/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  memcached:
    container_name: memcached
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  user-service:
    container_name: user-service
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_USER}
      PASETO_PRIVATE_KEY: ${PASETO_PRIVATE_KEY}
    ports:
      - 50051:50051
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth-service:
    container_name: auth-service
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports:
      - 50052:50052
    depends_on:
      user-service:
        condition: service_healthy
      memcached:
        condition: service_healthy
    environment:
      MEMCACHED_HOST: ${MEMCACHED_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      PASETO_PRIVATE_KEY: ${PASETO_PRIVATE_KEY}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50052"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  video-service:
    container_name: video-service
    build:
      context: ./backend
      dockerfile: video-service/Dockerfile
    ports:
      - 50053:50053
    depends_on:
      video-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_VIDEO}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      ACTIVITY_SERVICE_HOST: ${ACTIVITY_SERVICE_HOST}
      ACTIVITY_SERVICE_PORT: ${ACTIVITY_SERVICE_PORT}
      PASETO_PRIVATE_KEY: ${PASETO_PRIVATE_KEY}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50053"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  activity-service:
    container_name: activity-service
    build:
      context: ./backend
      dockerfile: activity-service/Dockerfile
    ports:
      - 50054:50054
    depends_on:
      activity-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_ACTIVITY}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      PASETO_PRIVATE_KEY: ${PASETO_PRIVATE_KEY}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50054"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chat-service:
    container_name: chat-service
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    expose:
      - "50055"
      - "8081"
    ports:
      - 50055:50055
      - 8081:8081
    depends_on:
      chat-db:
        condition: service_healthy
    environment:
      PORT: ${CHAT_SERVICE_PORT}
      DATABASE_URL: ${DATABASE_URL_CHAT}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50055"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  live-service:
    container_name: live-service
    build:
      context: ./backend
      dockerfile: live-service/Dockerfile
    expose:
      - "50056"
    ports:
      - 50056:50056
    environment:
      PORT: ${LIVE_SERVICE_PORT}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50056"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  playlist-service:
    container_name: playlist-service
    build:
      context: ./backend
      dockerfile: playlist-service/Dockerfile
    expose:
      - "50057"
    ports:
      - 50057:50057
    environment:
      PORT: ${PLAYLIST_SERVICE_PORT}
      DATABASE_URL: ${DATABASE_URL_PLAYLIST}
      VIDEO_SERVICE_HOST: ${VIDEO_SERVICE_HOST}
      VIDEO_SERVICE_PORT: ${VIDEO_SERVICE_PORT}
    networks:
      - app-network
    depends_on:
      playlist-db:
        condition: service_healthy
      video-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50057"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - 3000:3000
    networks:
      - app-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  user-db-data:
  video-db-data:
  activity-db-data:
  chat-db-data:
  playlist-db-data:
  minio-data:

networks:
  app-network:
    driver: bridge