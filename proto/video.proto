syntax = "proto3";

package video;

option go_package = "github.com/KennedySurianto/tpa_web/backend/shared/gen/video;video";

import "google/protobuf/timestamp.proto";

message User {
  uint64 id = 1;
  string username = 2;
  bytes avatar = 3;
}
// Video message definition
message Video {
  uint32 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.Timestamp deleted_at = 4;
  
  // Video metadata
  uint32 user_id = 5;
  string video_url = 6;
  bytes thumbnail = 7;
  string caption = 8;
  optional string description = 9;
  int32 duration = 10;
  
  // Optional associations
  optional uint32 sound_id = 11;
  string privacy = 12;
  
  // Cached metrics
  uint32 views_count = 13;
  uint32 likes_count = 14;
  uint32 comments_count = 15;
  
  // Feature flags
  bool allow_comments = 16;
  bool allow_duet = 17;
  bool allow_stitch = 18;

  User user = 19;

  bool is_liked = 20;
  uint64 like_count = 21;
}

// Request/Response messages
message CreateVideoRequest {
  uint32 user_id = 1;
  string video_url = 2;
  optional bytes thumbnail = 3;
  string caption = 4;
  optional string description = 5;
  int32 duration = 6;
  optional uint32 sound_id = 7;
  string privacy = 8;
  bool allow_comments = 9;
  bool allow_duet = 10;
  bool allow_stitch = 11;

  bytes video_data = 12;         // Raw binary video data
  string content_type = 13;      // e.g. "video/mp4"
}

message CreateVideoResponse {
  Video video = 1;
}

message GetVideoRequest {
  uint32 id = 1;
}

message GetVideoResponse {
  Video video = 1;
}

message UpdateVideoRequest {
  uint32 id = 1;
  optional bytes thumbnail = 2;
  optional string caption = 3;
  optional string privacy = 4;
  optional bool allow_comments = 5;
  optional bool allow_duet = 6;
  optional bool allow_stitch = 7;
}

message UpdateVideoResponse {
  Video video = 1;
}

message DeleteVideoRequest {
  uint32 id = 1;
}

message DeleteVideoResponse {
  bool success = 1;
}

message GetVideosByUserIdRequest {
  uint32 current_user_id = 1;
  uint32 user_id = 2;
}

message UpdateMetricsRequest {
  uint32 id = 1;
  optional uint32 views_count = 2;
  optional uint32 likes_count = 3;
  optional uint32 comments_count = 4;
}

message UpdateMetricsResponse {
  Video video = 1;
}

message GetRecommendedVideosRequest {
  uint32 user_id = 1;              // Optional: anonymous users can pass an empty string
  int32 limit = 2;                 // Max number of videos to return
  uint32 last_video_id = 3;        // For pagination (e.g., infinite scroll)
  uint32 device_id = 4;            // Optional: to support anonymous personalization
  string language = 5;             // Optional: user or device language
}

message GetVideosResponse {
  repeated Video videos = 1;
}

// for caption generator
message GetCaptionsRequest {
  uint32 video_id = 1;
}

message CaptionList {
  repeated string lines = 1;
}

message GetCaptionsResponse {
  map<string, CaptionList> captions = 1;
}

// Video service definition
service VideoService {
  rpc CreateVideo(CreateVideoRequest) returns (CreateVideoResponse);
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);
  rpc UpdateVideo(UpdateVideoRequest) returns (UpdateVideoResponse);
  rpc DeleteVideo(DeleteVideoRequest) returns (DeleteVideoResponse);
  rpc GetVideosByUserId(GetVideosByUserIdRequest) returns (GetVideosResponse);
  rpc UpdateMetrics(UpdateMetricsRequest) returns (UpdateMetricsResponse);
  rpc GetRecommendedVideos(GetRecommendedVideosRequest) returns (GetVideosResponse);
  // caption generator
  rpc GetCaptions(GetCaptionsRequest) returns (GetCaptionsResponse);
  // friends videos
  rpc GetFriendVideos(GetVideosByUserIdRequest) returns (GetVideosResponse);
  rpc GetFollowingVideos(GetVideosByUserIdRequest) returns (GetVideosResponse);
  rpc GetAllVideos(GetVideosByUserIdRequest) returns (GetVideosResponse);
  rpc GetLikedVideosByUserId(GetVideosByUserIdRequest) returns (GetVideosResponse);
}