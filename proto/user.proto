syntax = "proto3";

package user;

option go_package = "github.com/KennedySurianto/tpa_web/backend/shared/gen/user;user";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetAllUsers(Empty) returns (UserListResponse);
  rpc GetUserByEmail(GetUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (UserResponse);
  rpc GetUserById(GetUserByIdRequest) returns (User);
  rpc UpdateUserPassword(UpdateUserPasswordRequest) returns (UserResponse);

  // Additional profile and preference management endpoints
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc UpdateLastLogin(UpdateLastLoginRequest) returns (UserResponse);

  rpc GetUsersByCountry(GetUsersByCountryRequest) returns (UserListResponse);
  rpc GetVerifiedUsers(Empty) returns (UserListResponse);
  
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (User);
}

message GetUserByUsernameRequest {
  string username = 1;
}

message UpdateUserPasswordRequest {
  string email = 1;
  string new_password = 2;
}

// Request Messages
message UserPreferences {
  bool allow_duet = 1;
  bool allow_stitch = 2;
  bool allow_download = 3;
  bool allow_comments = 4;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
  string bio = 5;
  bytes avatar = 6;
  string country = 7;
  bool is_private = 8;
  UserPreferences preferences = 9;
}

message GetUserRequest {
  string email = 1;
}

message DeleteUserRequest {
  string email = 1;
}

message GetUserByIdRequest {
  uint64 id = 1;
}

message UpdateUserRequest {
  uint32 id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  bytes avatar = 5;
  bool is_verified = 6;
  bool is_private = 7;
  bool is_active = 8;
  string country = 9;
  bool allow_duet = 10;
  bool allow_stitch = 11;
  bool allow_download = 12;
  bool allow_comments = 13;

  bool new_follower_notification = 19;
  bool message_notification = 20;
  bool mention_notification = 21;
  string like_tab_visibility = 22;
  string chat_restriction = 23;
}

message UpdateLastLoginRequest {
  uint64 user_id = 1;
}

message GetUsersByCountryRequest {
  string country = 1;
}

message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string password = 4; // hashed
  string display_name = 5;
  string bio = 6;
  bytes avatar = 7;
  bool is_verified = 8;
  bool is_private = 9;
  bool is_active = 10;
  int64 last_login_at = 11;  // Unix timestamp
  string country = 12;
  bool allow_duet = 13;
  bool allow_stitch = 14;
  bool allow_download = 15;
  bool allow_comments = 16;
  int64 created_at = 17;     // Unix timestamp
  int64 updated_at = 18;     // Unix timestamp

  bool new_follower_notification = 19;
  bool message_notification = 20;
  bool mention_notification = 21;
  string like_tab_visibility = 22;
  string chat_restriction = 23;
}

message UserResponse {
  string message = 1;
  User user = 2;  // Optional: return user data after operations
}

message UserListResponse {
  repeated User users = 1;
  int32 total_count = 2;     // Total number of users
  int32 page = 3;            // Current page (for pagination)
  int32 page_size = 4;       // Page size (for pagination)
}

// Utility Messages
message Empty {}