syntax = "proto3";

package activity;

option go_package = "github.com/KennedySurianto/tpa_web/backend/shared/gen/activity;activity";

message User {
    uint64 id = 1;
    string username = 2;
    bytes avatar = 3;
}

message Comment {
    uint64 id = 1;
    string created_at = 2;
    string updated_at = 3;
    
    uint64 user_id = 4;
    uint64 video_id = 5;
    string content = 6;
    uint64 reply_to_id = 7;

    User user = 8;
    Comment reply_to = 9;

    uint64 like_count = 10;
    bool is_liked = 11;

    repeated Comment replies = 12;
}

// Request to get comments for a video
message GetCommentsRequest {
    uint64 video_id = 1;
    uint64 user_id = 2;
}

// Response with list of comments including user info
message GetCommentsResponse {
    repeated Comment comments = 1;
}

message CreateCommentRequest {
    uint32 user_id = 1;
    uint32 video_id = 2;
    string content = 3;
    uint32 reply_to_id = 4;
}

message CreateCommentResponse {
    Comment comment = 1;
}

message GetCommentCountRequest {
    uint32 video_id = 1;
}
message GetCommentCountResponse {
    uint64 count = 1;
}

// Service definition
service CommentService {
    rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
    rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
    rpc GetCommentCount(GetCommentCountRequest) returns (GetCommentCountResponse);
}
