syntax = "proto3";

package auth;

option go_package = "github.com/KennedySurianto/tpa_web/backend/shared/gen/auth;auth";

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse);

  rpc SendOTP (SendOTPRequest) returns (SendOTPResponse);
  rpc VerifyOTP (VerifyOTPRequest) returns (VerifyOTPResponse);

  rpc LoginWithGoogle(LoginWithGoogleRequest) returns (AuthResponse);
}

// OTP REQUESTS AND RESPONSES
message SendOTPRequest {
  string email = 1;
}

message SendOTPResponse {
  string message = 1;
}

message VerifyOTPRequest {
  string email = 1;
  string otp = 2;
}

message VerifyOTPResponse {
  bool success = 1;
  string message = 2;
}

// Request Messages
message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string confirm_password = 4;
  string display_name = 5;
  string bio = 6;
  bytes avatar = 7;
  string country = 8;
  bool is_private = 9;
  UserPreferences preferences = 10;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  bool remember_me = 3;
  string device_info = 4;    // Optional device/browser info for security
}

message LogoutRequest {
  string refresh_token = 1;
  bool logout_all_devices = 2;  // Logout from all devices
}

message ValidateTokenRequest {
  string access_token = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message ChangePasswordRequest {
  string access_token = 1;
  string current_password = 2;
  string new_password = 3;
  string confirm_new_password = 4;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string otp = 2;
  string new_password = 3;
}

message VerifyEmailRequest {
  string verification_token = 1;
}

message ResendVerificationRequest {
  string email = 1;
}

// Response Messages
message AuthResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
  string access_token = 4;
  string refresh_token = 5;
  User user = 6;
  int64 expires_at = 7;           // Unix timestamp for access token
  int64 refresh_expires_at = 8;   // Unix timestamp for refresh token
  TokenInfo token_info = 9;       // Additional token metadata
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message ValidateTokenResponse {
  bool valid = 1;
  string message = 2;
  uint64 user_id = 3;
  string email = 4;
  string username = 5;
  google.protobuf.Timestamp expires_at = 6;
  repeated string permissions = 7;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

message VerifyEmailResponse {
  bool success = 1;
  string message = 2;
}

message ResendVerificationResponse {
  bool success = 1;
  string message = 2;
}

// Data Messages
message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  string bio = 5;
  bytes avatar = 6;
  bool is_verified = 7;
  bool is_private = 8;
  bool is_active = 9;
  int64 last_login_at = 10;  // Unix timestamp
  string country = 11;
  bool allow_duet = 12;
  bool allow_stitch = 13;
  bool allow_download = 14;
  bool allow_comments = 15;
  int64 created_at = 16;     // Unix timestamp
  int64 updated_at = 17;     // Unix timestamp
}

message UserPreferences {
  bool allow_duet = 1;
  bool allow_stitch = 2;
  bool allow_download = 3;
  bool allow_comments = 4;
  bool email_notifications = 5;
  bool push_notifications = 6;
  string privacy_level = 7;       // "public", "friends", "private"
  string comment_filter = 8;      // "all", "friends", "none"
  bool show_activity_status = 9;
  bool allow_mentions = 10;
  bool allow_direct_messages = 11;
}

message UserStats {
  uint64 followers_count = 1;
  uint64 following_count = 2;
  uint64 videos_count = 3;
  uint64 likes_received = 4;
  uint64 views_received = 5;
}

message TokenInfo {
  string token_type = 1;          // "Bearer"
  int64 expires_in = 2;           // Seconds until expiration
  repeated string scopes = 3;      // Token scopes/permissions
  string device_id = 4;           // Device identifier
  google.protobuf.Timestamp issued_at = 5;
}

// Error codes for better error handling
enum AuthErrorCode {
  AUTH_ERROR_UNKNOWN = 0;
  AUTH_ERROR_INVALID_CREDENTIALS = 1;
  AUTH_ERROR_USER_NOT_FOUND = 2;
  AUTH_ERROR_USER_ALREADY_EXISTS = 3;
  AUTH_ERROR_INVALID_TOKEN = 4;
  AUTH_ERROR_TOKEN_EXPIRED = 5;
  AUTH_ERROR_ACCOUNT_DISABLED = 6;
  AUTH_ERROR_ACCOUNT_NOT_VERIFIED = 7;
  AUTH_ERROR_PASSWORD_TOO_WEAK = 8;
  AUTH_ERROR_EMAIL_NOT_VERIFIED = 9;
  AUTH_ERROR_TOO_MANY_ATTEMPTS = 10;
  AUTH_ERROR_INVALID_EMAIL_FORMAT = 11;
  AUTH_ERROR_USERNAME_TAKEN = 12;
  AUTH_ERROR_EMAIL_TAKEN = 13;
}

// Enhanced error response
message AuthError {
  AuthErrorCode code = 1;
  string message = 2;
  map<string, string> details = 3;  // Additional error details
}

message LoginWithGoogleRequest {
  string id_token = 1;      // The ID token received from Google
  string device_info = 2;   // Optional: for tracking
}

