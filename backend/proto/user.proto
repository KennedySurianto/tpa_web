syntax = "proto3";

package user;

option go_package = "github.com/KennedySurianto/tpa_web/backend/shared/gen/user;user";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetAllUsers(Empty) returns (UserListResponse);
  rpc GetUserByEmail(GetUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (UserResponse);
  rpc GetUserById(GetUserByIdRequest) returns (User);

  // Additional profile and preference management endpoints
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UserResponse);
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UserResponse);
  rpc SetUserPrivacyStatus(SetUserPrivacyStatusRequest) returns (UserResponse);
  rpc SetUserActiveStatus(SetUserActiveStatusRequest) returns (UserResponse);
  rpc UpdateLastLogin(UpdateLastLoginRequest) returns (UserResponse);

  rpc GetUsersByCountry(GetUsersByCountryRequest) returns (UserListResponse);
  rpc GetVerifiedUsers(Empty) returns (UserListResponse);
}

// Request Messages
message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
  string bio = 5;
  string avatar_url = 6;
  string country = 7;
}

message GetUserRequest {
  string email = 1;
}

message UpdateUserRequest {
  string email = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  string bio = 5;
  string avatar_url = 6;
  string country = 7;
}

message DeleteUserRequest {
  string email = 1;
}

message GetUserByIdRequest {
  uint64 id = 1;
}

message UpdateUserProfileRequest {
  uint64 user_id = 1;
  string display_name = 2;
  string bio = 3;
  string avatar_url = 4;
  string country = 5;
}

message UpdateUserPreferencesRequest {
  uint64 user_id = 1;
  bool allow_duet = 2;
  bool allow_stitch = 3;
  bool allow_download = 4;
  bool allow_comments = 5;
}

message SetUserPrivacyStatusRequest {
  uint64 user_id = 1;
  bool is_private = 2;
}

message SetUserActiveStatusRequest {
  uint64 user_id = 1;
  bool is_active = 2;
}

message UpdateLastLoginRequest {
  uint64 user_id = 1;
}

message GetUsersByCountryRequest {
  string country = 1;
}

// Response Messages
message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string password = 4; // hashed
  string display_name = 5;
  string bio = 6;
  string avatar_url = 7;
  bool is_verified = 8;
  bool is_private = 9;
  bool is_active = 10;
  int64 last_login_at = 11;  // Unix timestamp
  string country = 12;
  bool allow_duet = 13;
  bool allow_stitch = 14;
  bool allow_download = 15;
  bool allow_comments = 16;
  int64 created_at = 17;     // Unix timestamp
  int64 updated_at = 18;     // Unix timestamp
}

message UserResponse {
  string message = 1;
  User user = 2;  // Optional: return user data after operations
}

message UserListResponse {
  repeated User users = 1;
  int32 total_count = 2;     // Total number of users
  int32 page = 3;            // Current page (for pagination)
  int32 page_size = 4;       // Page size (for pagination)
}

// Utility Messages
message Empty {}

// Additional specialized messages for different user views
message UserProfile {
  uint64 id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  string avatar_url = 5;
  bool is_verified = 6;
  bool is_private = 7;
  string country = 8;
  int64 created_at = 9;
}

message UserPreferences {
  uint64 user_id = 1;
  bool allow_duet = 2;
  bool allow_stitch = 3;
  bool allow_download = 4;
  bool allow_comments = 5;
}

message UserStats {
  uint64 user_id = 1;
  int64 last_login_at = 2;
  bool is_active = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

// Pagination request (for future use)
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
  string sort_by = 3;
  string sort_order = 4;  // "asc" or "desc"
}

// Search request (for future use)
message SearchUsersRequest {
  string query = 1;
  PaginationRequest pagination = 2;
  bool verified_only = 3;
  bool active_only = 4;
  string country = 5;
}