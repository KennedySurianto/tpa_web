root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/app ./cmd"
  bin = "tmp/app"
  include_ext = ["*"]
  exclude_dir = ["tmp", "vendor", ".git"]
  stop_on_error = true
  delay = 500

[log]
  time = true

[env]
  APP_ENV = "development"

[watcher]
  poll = true
  interval = 1000

[run]
  cmd = "/entrypoint.sh"
